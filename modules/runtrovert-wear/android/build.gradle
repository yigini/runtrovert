plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.runtrovert'
version = '0.1.0'

android {
  namespace "app.runtrovert.wear.phone"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Wearable Data Layer: phone <-> watch over the link Wear OS already keeps open.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
