name: Logic tests

# Fast pure-code checks on every pull request, so a PR shows red before anyone builds an APK.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Logic tests
        run: |
          npm test
          TZ=Europe/Rome npm run test:reminders
