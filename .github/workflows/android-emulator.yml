name: Android emulator user journeys

on:
  # Bootstrap and iterate on the isolated test environment without changing main.
  push:
    branches: [codex/android-test-environment]
    paths:
      - .github/workflows/android-emulator.yml
      - scripts/android-emulator-smoke.sh
      - scripts/android-user-journeys.py
      - scripts/android_data_journeys.py
      - scripts/android_extra_journeys.py
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android APK workflow run containing runtrovert-aab
        required: true
        default: '41319989111'
        type: string
      cases:
        description: Optional comma-separated journey IDs; empty runs all checks
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-emulator-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id || '41319989111' }}
      RT_CASES: ${{ inputs.cases || '04-background-permission-cancel,11-units-theme-persistence,15-backup-roundtrip,16-truncated-backup-safety,17-malformed-backup-rollback,18-gpx-import-deduplication,19-process-death-recovery,20-mode-fallback-countdown-cancel,21-plan-setup-session-guidance,22-plan-health-warning-cancel,23-plan-pause-rest-ill-stop,24-listen-choices-privacy-cancel' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record and validate the source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > evidence/source-build.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/android.yml"' evidence/source-build.json
          jq '{id, head_sha, head_branch, conclusion, html_url, created_at}' evidence/source-build.json

      - name: Download the existing release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtrovert-aab
          path: build-input
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Make an emulator APK from the same build
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find build-input -maxdepth 2 -name '*.aab' -type f)
          test "${#bundles[@]}" -eq 1
          sha256sum "${bundles[0]}" > evidence/bundle-sha256.txt
          curl --fail --location --retry 3 --output bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  bundletool.jar' | sha256sum --check
          java -jar bundletool.jar dump manifest --bundle="${bundles[0]}" > evidence/AndroidManifest.xml
          grep -q 'package="app.runtrovert"' evidence/AndroidManifest.xml
          keytool -genkeypair -keystore emulator-test.keystore -storepass android -keypass android -alias emulator-test -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Runtrovert Emulator Test'
          java -jar bundletool.jar build-apks --bundle="${bundles[0]}" --output=emulator.apks --mode=universal --ks=emulator-test.keystore --ks-pass=pass:android --ks-key-alias=emulator-test --key-pass=pass:android
          unzip -p emulator.apks universal.apk > emulator-only.apk
          unzip -Z1 emulator-only.apk > evidence/apk-entries.txt
          grep -q '^lib/x86_64/' evidence/apk-entries.txt
          sha256sum emulator-only.apk > evidence/apk-sha256.txt

      - name: Enable hardware acceleration on this disposable runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Boot Android and install Runtrovert
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: runtrovert-test
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-linux-hw-accel: false
          script: |
            bash scripts/android-emulator-smoke.sh
            python3 scripts/android-user-journeys.py

      - name: Keep screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-evidence-${{ github.run_number }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
