name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner image ships the Android SDK at $ANDROID_HOME; nothing to install.

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # One stable test key (repository secrets), so each test APK installs over the last
      # and keeps the runs on the phone. Without the secrets (e.g. a fork), a throwaway key.
      - name: Test signing key
        env:
          KEYSTORE_B64: ${{ secrets.RUNTROVERT_TEST_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.RUNTROVERT_TEST_KEY_PASSWORD }}
        run: |
          mkdir -p $HOME/.android
          KS=$HOME/.android/test.keystore
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $KS
            ALIAS=runtrovert-test
            echo "Signing with the stable test key"
          else
            KEY_PASSWORD=android
            ALIAS=androiddebugkey
            keytool -genkeypair -keystore $KS -storepass android -alias $ALIAS -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No test key secrets; this APK will not install over earlier ones"
          fi
          echo "KS=$KS" >> $GITHUB_ENV
          echo "KS_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "::add-mask::$KEY_PASSWORD"
          echo "KS_PASS=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'package-lock.json') }}

      # Release build signed with the test key: installs on any phone for testing.
      # For the Play Store, add a real keystore as repository secrets and uncomment the
      # signing step below (see README → Signing).
      - name: Build release APK (test-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon "-Pandroid.injected.signing.store.file=$KS" "-Pandroid.injected.signing.store.password=$KS_PASS" "-Pandroid.injected.signing.key.alias=$KS_ALIAS" "-Pandroid.injected.signing.key.password=$KS_PASS"

      # - name: Decode release keystore
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      # - name: Build release APK (store-signed)
      #   working-directory: android
      #   run: ./gradlew assembleRelease --no-daemon -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk runtrovert-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: runtrovert-apk
          path: runtrovert-*.apk
          retention-days: 30
