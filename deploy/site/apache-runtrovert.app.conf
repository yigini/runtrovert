# Host Apache: TLS for runtrovert.app (certbot), redirects, then proxy to the container.
# Needs mod_proxy, mod_proxy_http, mod_headers, mod_ssl, mod_rewrite.
<VirtualHost *:80>
  ServerName runtrovert.app
  ServerAlias www.runtrovert.app
  # certbot's HTTP-01 check is answered before the redirect.
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://runtrovert.app%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName runtrovert.app
  ServerAlias www.runtrovert.app
  RewriteEngine On
  RewriteCond %{HTTP_HOST} ^www\. [NC]
  RewriteRule ^ https://runtrovert.app%{REQUEST_URI} [R=301,L]

  ProxyPreserveHost On
  ProxyPass        / http://127.0.0.1:8085/
  ProxyPassReverse / http://127.0.0.1:8085/
  Header always set Strict-Transport-Security "max-age=31536000"

  # certbot fills these in.
  # SSLCertificateFile    /etc/letsencrypt/live/runtrovert.app/fullchain.pem
  # SSLCertificateKeyFile /etc/letsencrypt/live/runtrovert.app/privkey.pem
  # Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
