# Host Apache for runtrovert.app: TLS, redirects, HSTS, then proxy to the container
# (127.0.0.1:8085). This is the file running on our server, which is DirectAdmin-managed:
# every site binds to the server's IPs, so a *:80 vhost would never match. It lives at
# /etc/httpd/conf/extra/httpd-runtrovert.conf, included from httpd-includes.conf.
# Needs mod_proxy, mod_proxy_http, mod_headers, mod_ssl, mod_rewrite.
<VirtualHost 46.19.33.37:80 [2a02:2770::21a:4aff:fe41:77b9]:80>
    ServerName runtrovert.app
    ServerAlias www.runtrovert.app
    # certbot webroot check, answered before the redirect.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://runtrovert.app%{REQUEST_URI} [R=301,L]
    ErrorLog /var/log/httpd/runtrovert_error.log
    CustomLog /var/log/httpd/runtrovert_access.log combined
</VirtualHost>
<VirtualHost 46.19.33.37:443 [2a02:2770::21a:4aff:fe41:77b9]:443>
    ServerName runtrovert.app
    ServerAlias www.runtrovert.app
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/runtrovert.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/runtrovert.app/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://runtrovert.app%{REQUEST_URI} [R=301,L]
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8085/ retry=0
    ProxyPassReverse / http://127.0.0.1:8085/
    RequestHeader set X-Forwarded-Proto "https"
    ErrorLog /var/log/httpd/runtrovert_ssl_error.log
    CustomLog /var/log/httpd/runtrovert_ssl_access.log combined
</VirtualHost>
