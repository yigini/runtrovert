server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 512;

  # Not part of the site.
  location = /README.md { return 404; }
  location = /CNAME { return 404; }

  # Only expires here: an add_header inside a location would drop the headers below.
  location / { try_files $uri $uri/ =404; expires epoch; }
  location ~* \.(mp4|jpg|png|svg|woff2)$ { expires 30d; }
  location ~* \.(css|js)$ { expires epoch; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
