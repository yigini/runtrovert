server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Not part of the site.
  location = /README.md { return 404; }
  location = /CNAME { return 404; }

  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
  location ~* \.(mp4|jpg|png|svg|woff2)$ { expires 30d; add_header Cache-Control "public"; }
  location ~* \.(css|js)$ { expires 1h; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
