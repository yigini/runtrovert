# runtrovert.app in its own container. nginx serves the repo's site/ folder read-only
# on 127.0.0.1:8085 only; the host's Apache keeps 80/443 and the certificate, and
# proxies runtrovert.app to this port (apache-runtrovert.app.conf).
services:
  web:
    image: nginx:1.27-alpine
    container_name: runtrovert-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ../../site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: 64m
    # Errors only (access_log is off); keep the container's own log small.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    cpus: 0.25
